<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUILD BURGER tune</title>
  <style>
    :root {
      --paper: #fff;
      --ink: #000;
      --grid: rgb(0 0 0 / 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Yu Gothic", "YuGothic", "游ゴシック", "Hiragino Sans", sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 220px;
      display: grid;
      gap: 12px;
    }

    #ui>section {
      display: grid;
      gap: 4px;
    }

    .label {
      font-weight: 700;
    }

    button {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 1px 8px;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    .row {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    a {
      color: var(--ink);
    }

    #hint {
      position: fixed;
      left: 16px;
      bottom: 16px;
    }

    /* 調整パネル（lil-gui）も、白黒にそろえる */
    .lil-gui {
      --background-color: #fff;
      --text-color: #000;
      --title-background-color: #fff;
      --title-text-color: #000;
      --widget-color: #eee;
      --hover-color: #ddd;
      --focus-color: #ccc;
      --number-color: #000;
      --string-color: #000;
      --font-family: "Yu Gothic", "YuGothic", "游ゴシック", "Hiragino Sans", sans-serif;
      --font-size: 12px;
      --name-width: 42%;
      border-left: 1px solid #000;
    }

    .lil-gui.root {
      position: fixed;
      top: 0;
      right: 0;
      width: 300px;
      max-height: 100%;
      overflow-y: auto;
    }

    .lil-gui .title {
      font-weight: 700;
    }
  </style>
  <script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/+esm"
} }
</script>
</head>

<body>
  <div id="ui">
    <section>
      <div class="label">具材</div>
      <div class="row" id="ingredients"></div>
    </section>
    <section>
      <div class="label">表示</div>
      <div class="row" id="view"></div>
    </section>
    <section>
      <div class="row"><button id="reseed">揺らぎを引き直す</button></div>
    </section>
    <section>
      <div class="label">調整した値</div>
      <div class="row">
        <button id="export">書き出す</button>
        <button id="import">読み込む</button>
        <input id="file" type="file" accept="application/json" hidden>
      </div>
      <div class="row"><button id="reset">この具材を初期値に戻す</button></div>
    </section>
    <section><a href="./index.html">← ジェネレーター</a></section>
  </div>
  <div id="hint">O 長押し：元のスキャンと比べる　ドラッグ：回転　ホイール：拡大<br>調整はこのブラウザに自動で保存。チームに共有するときは「書き出す」で look.json を作り、03_work/web/ に置く</div>
  <script type="module" src="./tune.js"></script>
</body>

</html>
